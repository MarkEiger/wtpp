[package]
name = "wtpp-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wtpp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
env_logger.workspace = true
log.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
slint.workspace = true
wtpp-config.workspace = true
wtpp-input.workspace = true
wtpp-render.workspace = true
wtpp-session.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The same version winit uses, to adjust its view class.
objc2 = "0.5"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# The same version winit uses: where the pointer is (X11).
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true
